<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Interlude</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="ui.css" />
    <style>
      html,
      body {
        width: 330px;
      }
      .popup {
        padding: 20px;
      }
      .head {
        padding-bottom: 16px;
        border-bottom: 1px solid #7a5600;
      }
      .head .wordmark {
        font-size: 13px;
      }
      h1 {
        font:
          20px Silkscreen,
          monospace;
        color: #ffb000;
        margin: 24px 0 6px;
      }
      .desc {
        font-size: 11px;
        color: #c5b99f;
        margin: 0 0 20px;
      }
      .actions {
        display: grid;
        gap: 8px;
      }
      .actions button,
      .actions a {
        width: 100%;
      }
      .status {
        min-height: 18px;
        margin-top: 14px;
        color: #c7a964;
        font-size: 10px;
      }
    </style>
  </head>
  <body>
    <div class="popup">
      <header class="head">
        <span class="wordmark"><span class="brandmark" aria-hidden="true"></span>INTERLUDE</span>
      </header>
      <main>
        <h1>TAKE A<br />BREAK.</h1>
        <p class="desc">Put every cabinet on hold.</p>
        <div class="actions">
          <button id="hour" type="button">PAUSE FOR 1 HOUR</button
          ><button id="tomorrow" type="button">PAUSE UNTIL TOMORROW</button
          ><a class="button primary" href="options.html" target="_blank">OPTIONS ↗</a>
        </div>
        <p class="status" id="status" role="status"></p>
      </main>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
