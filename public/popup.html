<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Interlude</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="ui.css" />
    <style>
      html,
      body {
        width: 356px;
        min-height: 200px;
      }
      .popup {
        padding: 20px;
      }
      .popup-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid #7a5600;
        padding-bottom: 16px;
      }
      .popup-head .wordmark {
        font-size: 13px;
      }
      .rev {
        font-size: 9px;
        color: #a99c82;
        letter-spacing: 0.1em;
      }
      .popup h1 {
        font:
          20px Silkscreen,
          monospace;
        color: #ffb000;
        margin: 24px 0 5px;
      }
      .popup .lead {
        color: #c5b99f;
        font-size: 11px;
        margin: 0 0 20px;
      }
      .power {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
        background: #171209;
        border: 1px solid #7a5600;
        padding: 14px;
      }
      .power strong {
        font-size: 11px;
        color: #ddc796;
        display: block;
      }
      .power small {
        font-size: 10px;
        color: #b4a587;
        display: block;
        margin-top: 2px;
      }
      .power input {
        width: 20px;
        height: 20px;
      }
      .readings {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        border-bottom: 1px solid #574014;
        padding: 15px 0;
        font-size: 10px;
        color: #a99c82;
      }
      .readings strong {
        color: #ffd36b;
        font-weight: 600;
      }
      .links {
        display: flex;
        gap: 7px;
        margin-top: 18px;
      }
      .links a {
        flex: 1;
        text-align: center;
      }
      .disclaimer {
        color: #99896e;
        font-size: 9px;
        letter-spacing: 0.04em;
        margin: 18px 0 0;
      }
    </style>
  </head>
  <body>
    <div class="popup">
      <header class="popup-head">
        <div class="wordmark"><span class="brandmark" aria-hidden="true"></span>INTERLUDE</div>
        <span class="rev">REV 0.1 / 01</span>
      </header>
      <main>
        <h1>CONTROL<br />PANEL.</h1>
        <p class="lead">The cabinet lives in the conversation.</p>
        <label class="power" for="enabled"
          ><span><strong>POWER</strong><small id="powerLabel">Checking local setting</small></span
          ><input id="enabled" type="checkbox"
        /></label>
        <div class="readings">
          <span>POSITION<br /><strong id="placement">—</strong></span
          ><span>DELAY<br /><strong id="delay">—</strong></span
          ><span>SITE<br /><strong id="site">—</strong></span>
        </div>
        <div class="links">
          <a class="button primary" href="options.html" target="_blank">SETTINGS ↗</a
          ><a class="button" href="diagnostics.html" target="_blank">DIAGNOSTICS ↗</a>
        </div>
        <p class="disclaimer">NO CHAT CONTENT READ / NO ACCOUNT</p>
      </main>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
