name: Validate and release
on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --audit-level=low
      - uses: actions/upload-artifact@v4
        with:
          name: validated-extension
          path: dist/
          if-no-files-found: error
          retention-days: 7
  release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/download-artifact@v4
        with:
          name: validated-extension
          path: dist/
      - name: Package and checksum the validated build
        run: node scripts/package-release.mjs "$GITHUB_REF_NAME"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/interlude-v*.zip release/interlude-latest.zip release/SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/interlude-v*.zip release/interlude-latest.zip release/SHA256SUMS.txt --title "Interlude $GITHUB_REF_NAME" --generate-notes
          fi
